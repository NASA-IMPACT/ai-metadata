[project]
name = "ai-metadata"
version = "0.1.0"
description = "Empirical harness: metadata format token economy and model x format LLM retrieval over NASA CMR records"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.111.0",
    "chromadb>=1.5.9",
    "deepeval>=4.1.5",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "ollama>=0.6.2",
    "openai>=2.43.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "tiktoken>=0.13.0",
    # The official TOON implementation, from git: the PyPI release of the same
    # name is a namespace reservation whose encode() raises NotImplementedError.
    "toon-format",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: touches the network (CMR, OpenAI, Ollama); run with `-m live`",
]
# Network tests are opt-in so the default suite stays fast and offline.
addopts = "-m 'not live'"

[tool.uv.sources]
toon-format = { git = "https://github.com/toon-format/toon-python", rev = "e475c82e9da03dfaf88c0b277dee6b5d17100b13" }
